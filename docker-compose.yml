# ─────────────────────────────────────────────────────────────────────────────
# garde-manger — déploiement PRODUCTION (VPS aydev)
#
# Différences avec la branche `dev` :
#   • Pas de reverse-proxy Caddy : le TLS est géré par le Traefik existant du VPS
#     (ports 80/443 déjà occupés). L'app est exposée à Traefik via des labels et
#     le réseau externe `aydev_aydev-net`.
#   • Durcissement sécurité (mem_limit, cap_drop, tmpfs noexec, no-new-privileges)
#     aligné sur le service presencejct — cf. incident cryptominer de mai 2026.
#
# Déploiement :  docker compose up -d --build
# Domaine     :  https://garde-manger.aydev.app (DNS déjà pointé sur le VPS)
# ─────────────────────────────────────────────────────────────────────────────
services:
  db:
    image: postgres:16-alpine
    container_name: garde-manger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Aucun port publié : PostgreSQL n'est joignable que depuis le réseau Docker.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - aydev-net

  app:
    build: .
    container_name: garde-manger-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      HOUSEHOLD_NAME: ${HOUSEHOLD_NAME}
      HOUSEHOLD_PASSWORD: ${HOUSEHOLD_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_DAYS: ${SESSION_DAYS:-180}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TZ: ${TZ:-Europe/Paris}
      PORT: 3000
    volumes:
      - app-data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.garde-manger.rule=Host(`garde-manger.aydev.app`)"
      - "traefik.http.routers.garde-manger.entrypoints=websecure"
      - "traefik.http.routers.garde-manger.tls.certresolver=letsencrypt"
      - "traefik.http.services.garde-manger.loadbalancer.server.port=3000"
    # ── Durcissement (borne le rayon d'action d'une éventuelle compromission) ──
    mem_limit: 1000m
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - aydev-net

  # Sauvegarde quotidienne de PostgreSQL (BACKUP_KEEP_DAYS jours de rétention).
  backup:
    image: postgres:16-alpine
    container_name: garde-manger-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: ${TZ:-Europe/Paris}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - app-data:/data:ro
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - aydev-net

volumes:
  db-data:
  app-data:

# Réseau partagé avec Traefik (défini par le compose racine /root/aydev).
networks:
  aydev-net:
    external: true
    name: aydev_aydev-net
